name: Selenium Test Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start AUT (OWASP Juice Shop)
        run: docker compose up -d

      - name: Wait for AUT to be ready
        run: |
          echo "Waiting 20 seconds for AUT to initialize..."
          sleep 20
          echo "AUT should be ready"

  tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start AUT (OWASP Juice Shop)
        run: docker compose up -d

      - name: Wait for AUT to be ready
        run: sleep 20

      - name: Run Tests
        run: mvn clean test -Dheadless=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-reports
          path: target/surefire-reports/


      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

  test-results-summary:
    needs: [ tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Post test results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let summary = '## 🧪 Test Results\n\n';
            
            const testReportPath = './tests-reports/TEST-LoginTests.xml';
           
            
            if (fs.existsSync(loginReportPath)) {
              const loginContent = fs.readFileSync(loginReportPath, 'utf8');
              const loginMatch = loginContent.match(/tests="(\d+)" failures="(\d+)" errors="(\d+)"/);
              if (loginMatch) {
                summary += `### LoginTests\n- Tests: ${loginMatch[1]}\n- Failures: ${loginMatch[2]}\n- Errors: ${loginMatch[3]}\n\n`;
              }
            }
            
            if (fs.existsSync(checkoutReportPath)) {
              const checkoutContent = fs.readFileSync(checkoutReportPath, 'utf8');
              const checkoutMatch = checkoutContent.match(/tests="(\d+)" failures="(\d+)" errors="(\d+)"/);
              if (checkoutMatch) {
                summary += `### CheckoutTests\n- Tests: ${checkoutMatch[1]}\n- Failures: ${checkoutMatch[2]}\n- Errors: ${checkoutMatch[3]}\n\n`;
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
